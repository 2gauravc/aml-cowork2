AWSTemplateFormatVersion: '2010-09-09'
Description: Single-instance EC2 demo deployment for AML Case Review Workspace.

Parameters:
  RepositoryUrl:
    Type: String
    Default: https://github.com/2gauravc/aml-cowork2.git
    Description: Public Git repository cloned by the instance bootstrap.
  RepositoryRawUrl:
    Type: String
    Default: https://raw.githubusercontent.com/2gauravc/aml-cowork2
    Description: Raw GitHub repository URL used to download the bootstrap script.
  RepositoryBranch:
    Type: String
    Default: main
    Description: Branch containing the deployment assets.
  ApplicationSecretArn:
    Type: String
    Description: ARN of the existing Secrets Manager JSON secret containing live application configuration.
  S3BucketName:
    Type: String
    Default: onbo-bkt
    Description: Existing document bucket name.
  S3Prefix:
    Type: String
    Default: ''
    Description: Optional object prefix within the document bucket.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Amazon Linux 2023 AMI SSM parameter.
  SecretKmsKeyArn:
    Type: String
    Default: ''
    Description: Optional customer-managed KMS key ARN used to encrypt ApplicationSecretArn.

Conditions:
  HasS3Access: !Not [!Equals [!Ref S3BucketName, '']]
  HasSecretKmsKey: !Not [!Equals [!Ref SecretKmsKeyArn, '']]

Resources:
  DemoVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: aml-cowork2-demo-vpc

  DemoInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: aml-cowork2-demo-igw

  DemoInternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref DemoInternetGateway
      VpcId: !Ref DemoVpc

  DemoPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref DemoVpc
      Tags:
        - Key: Name
          Value: aml-cowork2-demo-public-routes

  DemoDefaultInternetRoute:
    Type: AWS::EC2::Route
    DependsOn: DemoInternetGatewayAttachment
    Properties:
      RouteTableId: !Ref DemoPublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref DemoInternetGateway

  DemoPublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DemoVpc
      CidrBlock: 10.42.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: aml-cowork2-demo-public-subnet

  DemoPublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref DemoPublicRouteTable
      SubnetId: !Ref DemoPublicSubnet

  DemoSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP access for the AML Case Review Workspace demo.
      VpcId: !Ref DemoVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Public HTTP application access. This demo endpoint is not encrypted.
      Tags:
        - Key: Name
          Value: aml-cowork2-demo-sg

  DemoInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: OptionalDocumentBucketAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - !If
                - HasS3Access
                - Effect: Allow
                  Action: s3:ListBucket
                  Resource: !Sub arn:${AWS::Partition}:s3:::${S3BucketName}
                  Condition:
                    StringLike:
                      s3:prefix:
                        - !If [HasS3Access, !Sub '${S3Prefix}*', '']
                - !Ref AWS::NoValue
              - !If
                - HasS3Access
                - Effect: Allow
                  Action:
                    - s3:GetObject
                    - s3:PutObject
                  Resource: !Sub arn:${AWS::Partition}:s3:::${S3BucketName}/${S3Prefix}*
                - !Ref AWS::NoValue
        - PolicyName: ApplicationSecretAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref ApplicationSecretArn
              - !If
                - HasSecretKmsKey
                - Effect: Allow
                  Action: kms:Decrypt
                  Resource: !Ref SecretKmsKeyArn
                  Condition:
                    StringEquals:
                      kms:ViaService: !Sub secretsmanager.${AWS::Region}.amazonaws.com
                - !Ref AWS::NoValue

  DemoInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref DemoInstanceRole

  DemoInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t3.medium
      IamInstanceProfile: !Ref DemoInstanceProfile
      SubnetId: !Ref DemoPublicSubnet
      SecurityGroupIds:
        - !GetAtt DemoSecurityGroup.GroupId
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 2
      Tags:
        - Key: Name
          Value: aml-cowork2-demo
      UserData:
        Fn::Base64: !Sub |
          #!/usr/bin/env bash
          set -euo pipefail
          bootstrap_url="${RepositoryRawUrl}/${RepositoryBranch}/infrastructure/ec2/user-data.sh"
          for attempt in $(seq 1 30); do
            if curl --fail --location --retry 3 "$bootstrap_url" --output /tmp/aml-cowork2-user-data.sh; then
              chmod +x /tmp/aml-cowork2-user-data.sh
              /tmp/aml-cowork2-user-data.sh "${RepositoryUrl}" "${RepositoryBranch}" "${ApplicationSecretArn}" "${S3BucketName}" "${S3Prefix}" "${AWS::Region}"
              exit 0
            fi
            sleep 10
          done
          exit 1

  DemoElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: aml-cowork2-demo-eip

  DemoElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt DemoElasticIp.AllocationId
      InstanceId: !Ref DemoInstance

Outputs:
  InstanceId:
    Description: EC2 instance ID.
    Value: !Ref DemoInstance
  ElasticIp:
    Description: Static public IP address for the HTTP demo.
    Value: !GetAtt DemoElasticIp.PublicIp
  ApplicationUrl:
    Description: HTTP application URL. This demo endpoint is not encrypted.
    Value: !Sub http://${DemoElasticIp.PublicIp}
  SessionManagerCommand:
    Description: Start an operator shell without opening SSH.
    Value: !Sub aws ssm start-session --target ${DemoInstance}
  VpcId:
    Description: VPC created for the demo environment.
    Value: !Ref DemoVpc
  PublicSubnetId:
    Description: Public subnet created for the demo environment.
    Value: !Ref DemoPublicSubnet
