name: other-risk-factors
description: Assess configurable other AML/CFT risk factors from retained CDD data. Use for CDD Checker assessments and findings for industry, jurisdiction, ownership-complexity, and trust or nominee concerns.
assessment:
  schema: other_risk_factors_assessment/v1
  category: other_risk_factors
factors:
  - id: high_risk_industry
    title: High-risk industry
    order: 10
    cdd_section: customer_business_profile
    method: llm_structured
    severity: medium
    risk_definition: A high-risk industry is one in which money laundering is commonly found because it can facilitate high-value, cash-intensive, opaque, cross-border, or third-party transactions.
    examples: [casinos and gambling, virtual assets, money services and remittance, trading of artwork or antiquities, precious metals or stones, arms and defence, adult entertainment]
    action: Confirm the current principal activity and assess the applicable industry-risk controls.
  - id: high_aml_risk_jurisdiction_link
    title: Link to high AML-risk jurisdiction
    order: 20
    cdd_section: customer_business_profile
    method: llm_structured
    severity: medium
    risk_definition: An AML-risk jurisdiction link requires review where retained facts show incorporation, operations, customers, suppliers, ownership, control, or other commercial links to a jurisdiction associated with material money-laundering, terrorist-financing, or sanctions-evasion risk.
    required_inputs: [country_of_incorporation, registered_address_country, business_activity, operating_locations, customers, suppliers, commercial_relationships, ownership_and_control_links]
    jurisdiction_lists:
      - name: FATF High-Risk Jurisdictions subject to a Call for Action
        source_url: https://www.fatf-gafi.org/en/countries/black-and-grey-lists.html
        reviewed_at: 2026-02-13
        country_codes: [KP, IR, MM]
      - name: FATF Jurisdictions under Increased Monitoring
        source_url: https://www.fatf-gafi.org/en/countries/black-and-grey-lists.html
        reviewed_at: 2026-02-13
        country_codes: [DZ, AO, BO, BG, CM, CI, CD, HT, KE, KW, LA, LB, MC, NA, NP, PG, SS, SY, VE, VN, VG, YE]
    action: Verify the jurisdiction link and apply the required enhanced due-diligence controls.
  - id: high_tax_risk_jurisdiction_link
    title: Link to high tax-risk jurisdiction
    order: 30
    cdd_section: customer_business_profile
    method: llm_structured
    severity: medium
    risk_definition: A tax-risk jurisdiction link requires review where retained facts show incorporation, operations, customers, suppliers, ownership, or other commercial links to a jurisdiction associated with material tax-transparency, tax-evasion, or secrecy risk.
    required_inputs: [country_of_incorporation, registered_address_country, business_activity, operating_locations, customers, suppliers, commercial_relationships]
    jurisdiction_lists:
      - name: EU list of non-cooperative jurisdictions for tax purposes — Annex I
        source_url: https://taxation-customs.ec.europa.eu/taxation/common-eu-list-third-country-jurisdictions-tax-purposes_en
        reviewed_at: 2026-02-17
        country_codes: [AS, AI, GU, PW, PA, RU, TC, VI, VU, VN]
      - name: EU list of jurisdictions committed to address tax good-governance deficiencies — Annex II
        source_url: https://taxation-customs.ec.europa.eu/taxation/common-eu-list-third-country-jurisdictions-tax-purposes_en
        reviewed_at: 2026-02-17
        country_codes: [BZ, VG, BN, SZ, GL, JO, ME, MA, TR]
      - name: Bank tax-haven overlay
        source_url: bank-maintained-policy
        reviewed_at: 2026-07-26
        country_codes: [KY]
    action: Verify the jurisdiction link, purpose, and any related tax-residency information.
  - id: complex_ownership_structure
    title: Complex ownership structure
    order: 40
    cdd_section: ownership_and_control
    method: deterministic_then_llm_summary
    severity: medium
    thresholds:
      ownership_layers: 3
      entity_count: 3
      cross_border_entities: 2
    action: Review the ownership graph, resolve outstanding branches, and document the source of wealth or control where appropriate.
  - id: trust_or_nominee_arrangement
    title: Trust or nominee arrangement
    order: 50
    cdd_section: ownership_and_control
    method: evidence_rule_mapping
    severity: medium
    terms: [trust, trustee, settlor, protector, beneficiary, nominee, nominee director, nominee shareholder]
    evidence_tools: [get_company_org_chart_by_case_id, get_company_members_by_case_id]
    indicator_field_names: [role, member_type, type, entity_type, ownership_type, relationship, capacity, legal_form]
    action: Obtain the governing trust or nominee documents and identify all relevant parties and controllers.
